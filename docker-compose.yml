services:
  db:
    image: postgres:16-alpine
    container_name: crewo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crewo
      POSTGRES_PASSWORD: crewo
      POSTGRES_DB: crewo
    ports:
      - "5432:5432"
    volumes:
      - crewo-pgdata:/var/lib/postgresql/data

volumes:
  crewo-pgdata:
